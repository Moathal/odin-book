default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  port: 5432
  host: <%= ENV["POSTGRES_HOST"] %>


development:
  <<: *default
  database: odinbook_development
  username: postgres
  password: password
  host: localhost

test:
  <<: *default
  database: odinbook_test
  username: postgres
  password: password
  host: localhost


production:
  <<: *default
  database: <%= ENV["POSTGRES_DB"] %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
